<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calisthenics hybrid training tracker">
  <title>Workout Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar / Bottom Nav -->
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-logo">
        <div class="sidebar-user-row">
          <div class="sidebar-avatar" id="sidebarAvatar"></div>
          <div>
            <h1 id="sidebarName">Tracker</h1>
            <p>Calisthenics Program</p>
          </div>
        </div>
        <a href="index.html" class="switch-user-link">← Switch user</a>
      </div>
      <div class="sidebar-nav">
        <a href="#dashboard" class="nav-link active" aria-label="Dashboard">
          <span class="nav-icon">🏠</span>
          <span>Dashboard</span>
        </a>
        <a href="#program" class="nav-link" aria-label="Training Program">
          <span class="nav-icon">📋</span>
          <span>Program</span>
        </a>
        <a href="#workout" class="nav-link" aria-label="Today's Workout">
          <span class="nav-icon">💪</span>
          <span>Today</span>
        </a>
        <a href="#calendar" class="nav-link" aria-label="Calendar">
          <span class="nav-icon">📅</span>
          <span>Calendar</span>
        </a>
        <a href="#nutrition" class="nav-link" aria-label="Nutrition">
          <span class="nav-icon">🥗</span>
          <span>Nutrition</span>
        </a>
        <a href="#progress" class="nav-link" aria-label="Progress">
          <span class="nav-icon">📈</span>
          <span>Progress</span>
        </a>
      </div>
    </nav>

    <!-- Main view -->
    <main class="main-content" id="view" role="main" aria-live="polite">
      <p style="color:var(--text-muted);padding:2rem;text-align:center">Loading...</p>
    </main>

  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" role="dialog" aria-modal="true"></div>

  <!-- Toast container -->
  <div id="toasts" aria-live="assertive" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
